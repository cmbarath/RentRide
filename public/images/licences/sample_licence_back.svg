      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
  </defs>
  <rect width="600" height="380" rx="16" fill="url(#dlBackBg)" stroke="#cbd5e1" stroke-width="2"/>
  
  <rect x="20" y="20" width="560" height="40" rx="6" fill="#334155"/>
